version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      action-runners:
        applies-to: "version-updates"
        update-types:
          - "patch"
          - "minor"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    # Same window as minimumReleaseAge in pnpm-workspace.yaml, because Dependabot passes it to pnpm and a longer one rejects packages already in the lockfile.
    cooldown:
      default-days: 1
    groups:
      patch-and-minor-dependencies:
        applies-to: "version-updates"
        update-types:
          - "patch"
          - "minor"
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/react-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-major"
    versioning-strategy: "increase-if-necessary"
    open-pull-requests-limit: 20
