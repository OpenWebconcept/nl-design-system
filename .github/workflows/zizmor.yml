name: zizmor

on:
  push:
    branches: main
    paths:
      - ".github/**"
  pull_request:
    paths:
      - ".github/**"

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest

    permissions:
      contents: read # clone the repo

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows and Dependabot config
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Fail the job with inline annotations instead of uploading to the Security tab.
          advanced-security: false
          annotations: true
